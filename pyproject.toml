[project]
name = "allen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aristóbulo Meneses", email = "aristobulo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.uv.build-backend]
include = ["src/allen/py.typed"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv/"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
pythonPlatform = "All"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "I",
    "B",
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=allen --cov-fail-under 90 --no-cov-on-fail --cov-report=term-missing -v --strict-markers"
